apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: douban-movies-analysis
  namespace: spark-jobs
spec:
  type: Python
  mode: cluster
  image: swr.cn-east-3.myhuaweicloud.com/cloud-course-2023112556-2023112429/douban-spark:v1
  imagePullPolicy: Always
  mainApplicationFile: local:///opt/spark/work-dir/douban_spark_analysis.py
  sparkVersion: 3.5.0
  restartPolicy:
    type: Never
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "1024m"
    labels:
      version: 3.5.0
    serviceAccount: spark
  executor:
    cores: 1
    instances: 2
    memory: "1024m"
    labels:
      version: 3.5.0
